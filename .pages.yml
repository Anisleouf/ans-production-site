
media: media

content:
  - name: actualites
    label: Actualités ANS Production
    type: collection
    path: content/actualites
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: body
        label: Article
        type: rich-text

  - name: jeux
    label: Nos jeux
    type: collection
    path: content/jeux
    fields:
      - name: title
        label: Nom du jeu
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: image
        label: Image du jeu
        type: image

  - name: reglages
    label: Personnaliser le site
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: homeIntro
        label: Texte de l'accueil
        type: text

      - name: featuredIntro
        label: Présentation Another Day
        type: text

      - name: studioStory
        label: Présentation du studio
        type: text

      - name: gameStatus
        label: État du jeu
        type: string

      - name: publicVersion
        label: Version publique
        type: string

      - name: platform
        label: Plateforme du jeu
        type: string

      - name: themeColor
        label: Couleur principale du site
        type: select
        options:
          values:
            - name: orange
              label: Orange original
            - name: bleu
              label: Bleu nuit
            - name: violet
              label: Violet
            - name: vert
              label: Vert

      - name: contactNotice
        label: Message de contact
        type: text

      - name: trailerUrl
        label: Lien bande-annonce
        type: string

      - name: downloadUrl
        label: Lien de téléchargement
        type: string

settings:
  content:
    merge: true
